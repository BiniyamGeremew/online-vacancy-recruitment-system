{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}


<div class="container-fluid">
  <div class="card">
    <div class="card-header"><h3 class="card-title">Profile</h3></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group mb-3 row">
            <label class="col-md-2 col-form-label">{{ field.label_tag }}</label>
            <div class="col-md-6">
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
            </div>
          </div>
        {% endfor %}
        <div class="mt-2">
          <button class="btn btn-success" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
