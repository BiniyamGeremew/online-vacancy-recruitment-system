{% extends "base.html" %}

{% block title %}Dean Profile{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      {% if profile %}
        <h3>{{ profile.user.get_full_name }}</h3>
        <p><strong>College:</strong> {{ profile.college.name }}</p>
        <p><strong>Phone:</strong> {{ profile.phone }}</p>
        <p>{{ profile.bio }}</p>
      {% else %}
        <p>No profile found.</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
