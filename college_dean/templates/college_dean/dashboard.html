{% extends "base.html" %}

{% block title %}College Dean Dashboard{% endblock %}

{% block content %}

<div class="row">
  <div class="col-md-3">
    <div class="small-box bg-info">
      <div class="inner">
        <h3>{{ pending }}</h3>
        <p>Pending Requests</p>
      </div>
    </div>
  </div>
  
  <div class="col-md-4">
    <div class="small-box bg-danger">
      <div class="inner">
        <h3>{{ rejected }}</h3>
        <p>Rejected</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="small-box bg-warning">
      <div class="inner">
        <h3>{{ forwarded }}</h3>
        <p>Forwarded to VP</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
