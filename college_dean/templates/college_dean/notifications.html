{% extends "base.html" %}

{% block title %}Dean Notifications{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-body">
      <ul>
        {% for it in items %}
        <li>{{ it.performed_at|date:"Y-m-d H:i" }} — {{ it.get_action_display }}: {{ it.request.subject }}</li>
        {% empty %}
        <li>No notifications.</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
